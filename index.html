async function translateVisible(){
 if(LANG==='th')return;
 const langMap={en:'en',es:'es',pt:'pt',id:'id',zh:'zh-CN',ja:'ja'}, target=langMap[LANG]||'en';
 const root=document.getElementById('app'); if(!root)return;
 const nodes=[]; const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()){const n=walker.currentNode, t=n.nodeValue.trim();if(t&&/[ก-๙]/.test(t)&&t.length<900)nodes.push([n,n.nodeValue]);}
 const cacheKey='academy-translations-v1-'+LANG;let cache={};try{cache=JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch(e){}
 await Promise.all(nodes.map(async ([node,original])=>{
  const t=original.trim(); if(!/[ก-๙]/.test(t))return;
  if(cache[t]){node.nodeValue=original.replace(t,cache[t]);return}
  try{
   const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(t);
   const res=await fetch(url);if(!res.ok)return;const data=await res.json();
   const translated=(data[0]||[]).map(x=>x[0]||'').join('');
   if(translated){cache[t]=translated;node.nodeValue=original.replace(t,translated)}
  }catch(e){}
 }));
 try{localStorage.setItem(cacheKey,JSON.stringify(cache))}catch(e){}
}
